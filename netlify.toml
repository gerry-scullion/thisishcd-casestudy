# Netlify config for the Case Study submission form
# Drag-and-drop deploy: zip this folder and drop into app.netlify.com,
# or connect the folder to a Git repo and point Netlify at it.

[build]
  publish = "."

# Make sure the success page is served at /success
[[redirects]]
  from = "/success"
  to = "/success.html"
  status = 200

# Friendly 404 (falls back to the form)
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
  force = false
