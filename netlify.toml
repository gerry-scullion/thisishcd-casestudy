# Netlify config for the Case Study submission form.
# Static site, no build step. Deploy the WHOLE folder (all 4 files) —
# index.html, success.html, netlify.toml, README.md.

[build]
  publish = "."

# Friendly alias: /success serves the success page (success.html also
# works directly). This is a rewrite, so the form's post-submission
# redirect resolves whether Netlify "Pretty URLs" is on or off.
[[redirects]]
  from = "/success"
  to = "/success.html"
  status = 200
